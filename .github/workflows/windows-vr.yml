# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Windows/x64 Build VR & publish version tagged commit

on:
  push:
    tags: ['v*.*.*-vr'] # This triggers the workflow only on version tags like v1.0.0-vr, v2.21.52-vr, etc.
    # branches: [ "feature/vr" ]
  # pull_request:
     # branches: [ "feature/build_test" ]

env:
  # Customize the build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  
  ARTIFACTS_PATH: ${{github.workspace}}/BuildArtifacts/TheForceEngineVR
  
jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2022 # windows-latest for VS2026

    steps:
      - name: Download & Install Inno Setup
        run: |
          curl -fSL --retry 3 -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          if (!(Test-Path "innosetup.exe")) {
            throw "Inno Setup download failed"
          }
          Write-Host "Inno Setup downloaded"
          start innosetup.exe /silent
          Write-Host "Inno Setup installed successfully"
    
      - name: Checkout code        
        uses: actions/checkout@v4

      - name: Update version file
        run: |
          "const char c_gitVersionSoVrHere[] = ""$(git describe --tags)"";" | Set-Content -Path ${{github.workspace}}/TheForceEngine/gitVersionSoVrHere.h
        
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64  

      - name: Build binaries
        run: |
          cmake.exe -G"Visual Studio 17 2022" -A x64 -B ./BuildArtifacts/Build -DENABLE_VR=ON -DSTART_VR=ON 
          cmake --build ./BuildArtifacts/Build --config ${{env.BUILD_TYPE}}

      - name: Build artifacts
        run: |
          cmake --install ./BuildArtifacts/Build --config ${{env.BUILD_TYPE}} --prefix ${{env.ARTIFACTS_PATH}}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: ${{env.ARTIFACTS_PATH}}

  release:
    needs: build
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-artifact
          path: ${{env.ARTIFACTS_PATH}}
          
      - name: Download VC++ redistributables
        run: |
          curl -fSL --retry 3 -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          if (!(Test-Path "vc_redist.x64.exe")) {
            throw "VC++ redistributable download failed"
          }

          Write-Host "VC++ redistributable downloaded"
          Get-Item "vc_redist.x64.exe" | Select-Object Name, Length

      - name: Download & Install Inno Setup
        run: |
          curl -fSL --retry 3 -o innosetup.exe https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          if (!(Test-Path "innosetup.exe")) {
            throw "Inno Setup download failed"
          }

          Write-Host "Inno Setup downloaded"
          Get-Item "innosetup.exe" | Select-Object Name, Length

          $process = Start-Process -FilePath "innosetup.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /ALLUSERS" -PassThru
          Write-Host "Installer PID: $($process.Id)"
          if (-not $process.WaitForExit(120000)) {
            Write-Host "=== Process state ==="
      
            Get-CimInstance Win32_Process |
              Where-Object {
                $_.Name -match "setup|inno|innosetup"
              } |
              Format-List ProcessId, ParentProcessId, Name, CommandLine
      
            Write-Host "=== Installer log ==="
      
            if (Test-Path $logFile) {
              Get-Content $logFile -Tail 100
            }
      
            Stop-Process -Id $process.Id -Force `
              -ErrorAction SilentlyContinue
      
            throw "Installer did not finish"
          }
      
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with code $($process.ExitCode)"
          }

          Write-Host "Inno Setup installed successfully"
      - name: Build Installer
        run: |
          & "c:/Program Files/Inno Setup 7/ISCC.exe" /Qp /DAppVersionNumber="${{github.ref_name}}" /DMSVCPath="${{github.workspace}}" /DProgramPath="${{env.ARTIFACTS_PATH}}" "${{github.workspace}}/TheForceEngine/Installer/Installer.iss"
              
      - name: Compress artifact directory
        run: Compress-Archive -Path ${{env.ARTIFACTS_PATH}}/ -Destination TheForceEngineVR.zip
        #run: zip -r TheForceEngineVR.zip ${{env.ARTIFACTS_PATH}}/

      - name: Create GitHub release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          # tag_name: ${{github.event.head_commit.message}}
          # release_name: "Release ${{github.event.head_commit.message}}"
          tag_name: ${{github.ref_name}}
          release_name: "Release ${{github.ref_name}}"
          draft: false
          prerelease: false

      - name: Upload Release asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          upload_url: ${{steps.create_release.outputs.upload_url}}
          asset_path: ./TheForceEngineVR.zip  # Path to your artifact file(s)
          asset_name: TheForceEngineVR.zip  # Custom name for the artifact file
          asset_content_type: application/zip  # Adjust based on file type
          
      - name: Upload Release installer
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        with:
          upload_url: ${{steps.create_release.outputs.upload_url}}
          asset_path: ${{env.ARTIFACTS_PATH}}/../Installer/TheForceEngineVR.Installer.exe  # Path to your artifact file(s)
          asset_name: TheForceEngineVR.Installer.exe  # Custom name for the artifact file
          asset_content_type: application/vnd.microsoft.portable-executable  # Adjust based on file type
